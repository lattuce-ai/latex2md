[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latex2md"
version = "0.1.0"
description = "Markdown <-> LaTeX conversion built on pandoc, with math, mhchem and citation clean-up."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
latex2md = "latex2md.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
latex2md = ["*.lua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
