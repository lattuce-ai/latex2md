[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lattuce-latex2md"
version = "0.3.0"
description = "Markdown <-> LaTeX conversion built on pandoc, with math, mhchem and citation clean-up."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
keywords = ["markdown", "latex", "pandoc", "converter", "arxiv"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Source = "https://github.com/lattuce-ai/latex2md"
Issues = "https://github.com/lattuce-ai/latex2md/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[project.scripts]
latex2md = "latex2md.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
latex2md = ["*.lua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
